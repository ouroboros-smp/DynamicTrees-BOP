plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-fabric-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net' }
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://maven.minecraftforge.net' }
    maven { url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/' }
}

sourceSets.main.java {
    // Dynamic Trees Plus has no Fabric 26.2 build yet; keep its mushroom-only extension optional and out of this jar.
    exclude 'com/dtteam/dtbop/DTBOPPlusRegistries.java'
    exclude 'com/dtteam/dtbop/block/GlowShroomCapProperties.java'
    exclude 'com/dtteam/dtbop/tree/GlowshroomSpecies.java'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    implementation "com.dtteam.dynamictrees:dynamictrees-fabric-${minecraft_version}:${dynamicTreesVersion}"
    implementation "maven.modrinth:biomes-o-plenty:${biomesOPlentyArtifactVersion}"
    runtimeOnly "maven.modrinth:glitchcore:${glitchCoreArtifactVersion}"
    runtimeOnly "com.github.glitchfiend:TerraBlender-fabric:${minecraft_version}-${terraBlenderVersion}"
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude 'trees/dtbop/cap_properties/**'
    exclude 'trees/dtbop/species/glowshroom.json'
    exclude 'trees/dtbop/species/toadstool.json'
    exclude 'data/dtbop/loot_table/blocks/glowshroom_cap.json'
    exclude 'data/dtbop/loot_table/blocks/toadstool_cap.json'
    exclude 'data/dtbop/loot_table/trees/mushroom_caps/**'
    exclude 'data/dtbop/loot_table/trees/voluntary/glowshroom.json'
    exclude 'data/dtbop/loot_table/trees/voluntary/toadstool.json'
}

processResources {
    inputs.properties([
            mod_id: mod_id,
            mod_name: mod_name,
            mod_version: mod_version,
            mod_authors: mod_authors,
            minecraft_version: minecraft_version,
            fabric_loader_version: fabric_loader_version,
            dynamicTreesVersion: dynamicTreesVersion,
            biomesOPlentyVersion: biomesOPlentyVersion,
            java_version: 25
    ])
    filesMatching('fabric.mod.json') {
        expand(inputs.properties)
    }
}

loom {
    runs {
        server {
            server()
            setConfigName('Fabric Server')
            runDir('runs/server')
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
}
